apiVersion: v1
kind: Pod
metadata:
  name: my-pod-probe
  labels:
    app: my-red-app
spec:
  containers:
    - name: mypod-con
      image: longflew/ingress:REDPAGE
      ports:
        - containerPort: 80
      startupProbe:
        exec:
          command:
            - touch
            - file.txt
        initialDelaySeconds: 5
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        successThreshold: 1
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        successThreshold: 1
        failureThreshold: 3